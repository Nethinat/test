# -------------------- Display settings --------------------
display_name: "&e&lบทที่ 3 &f– &6เมืองนี้มีชีวิต"
description: 
  - '&fऎ ความยาก : &6ปานกลาง'
  - '&f เลเวลแนะนำ : &a10+'
  - '&f'
  - '&7เป้าหมายภารกิจ'
  - "&e&l| &fทำภารกิจย่อยในเมืองแมวนครเพื่อปลดล็อกเนื้อเรื่องหลัก"
  - "&e&l| &fเดินทางไปยังหอคอยแห่งแสงเพื่อเริ่มการผจญภัยครั้งใหม่"
  - '&f'
  - '&f &fรางวัลเควส &f'
  - "&e&l| &ax10 &fแต้มเควส"
  - "&e&l| &ax300 &fเงิน"
  - "&e&l| &ax500 &fค่าประสบการณ์"
  - "&e&l| &fไอเทมพิเศษตามเส้นทางที่เลือก"
  - '&f' 
  - '&c** เควสนี้จำเป็นต้องผ่านบทที่ 2 ก่อน **'
  - '&a** เควสนี้มีระบบทางเลือกที่ส่งผลต่อเนื้อเรื่อง **'

start_notify:
  title: '&6เมืองนี้มีชีวิต'
  title_subtitle: '&fเลือกเส้นทางการผจญภัยของคุณเอง'
  sound: ENTITY_CAT_PURR

progress_notify:
  bossbar: '{objective}'
  bossbar_color: PINK
  bossbar_style: SOLID
  bossbar_flags: []
  bossbar_duration: 10 SECOND

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10145
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&f &cภารกิจนี้ถูกล็อค &f'
    lore: |
      &c
      &eภารกิจเนื้อเรื่องบทที่ 3
      &c
      &cหากต้องการปลดล็อคภารกิจนี้ คุณต้องสำเร็จภารกิจ
      &fบทที่ 2 – ตำนานทั้งเจ็ด
      &cให้สำเร็จเสียก่อน
  COOLDOWN:
    type: BARRIER
    name: '&f &cท่านได้ทำภารกิจนี้ไปแล้ว &f'
    lore: |
      &c
      &cท่านได้ทำภารกิจนี้สำเร็จแล้ว จึงไม่สามารถรับภารกิจนี้ซ้ำได้

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_CAT_PURR
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: ENTITY_CAT_HISS
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: ENTITY_CAT_HISS
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]

# -------------------- Quest content --------------------

branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        name_short: เริ่มบทที่ 3
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &dบทที่ 3 – เมืองนี้มีชีวิต\n&fชีวิตประจำวันในเมืองแมวนคร
        goto: OBJECT obj2

      obj2:
        name_short: เนื้อเรื่องเปิดตัว
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 100
          - 'SEND_MESSAGE &f &6[ระบบ]: &fแดดอ่อนยามเช้าเริ่มแตะขอบฟ้า เมืองแมวนครเริ่มคึกคัก'
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเสียงพ่อค้าแม่ค้าตะโกนเรียกลูกค้า เสียงตีเหล็กจากร้านตีบวก และเสียงหัวเราะจากผู้เล่นที่กำลังแข่งกันเก็บของ'
          - 'SEND_MESSAGE &f'
          - 'SEND_MESSAGE &f &6[ระบบ]: &f%player_name% ตื่นขึ้นที่ห้องพักในโรงเตี๊ยมของเนียบิว'
          - 'SEND_MESSAGE &f &6[ระบบ]: &fหลังจากภารกิจเมื่อวาน เขาตั้งใจจะไปที่ห้องสมุดโบราณ แต่...'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 80
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj3

      obj3:
        name_short: ข้อความระบบ
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &c[ข้อความจากระบบ]\n&f"เนื้อเรื่องหลักถูกล็อค! กรุณาเคลียร์ภารกิจย่อยอย่างน้อย 2 เควสต์เพื่อดำเนินต่อ"
        goto: OBJECT obj4

      obj4:
        name_short: ตื่นที่โรงเตี๊ยม
        objective_detail: ตื่นที่โรงเตี๊ยมและพบข้อความระบบ
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,2700,36,2785
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: tavern
        goto: OBJECT obj5

      obj5:
        name_short: พบข้อความระบบ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "...หืม เกมนี้มีระบบบังคับทำเควสต์ย่อยก่อนด้วยแฮะ เข้าใจล่ะ จะลองดูสักหน่อย"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "อ้าว ตื่นแล้วเหรอ เมี้ยววว~? ยังไปห้องสมุดโบราณไม่ได้หรอก เมือง~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "เมืองแมวนครมีประเพณีโบราณ คนแปลกหน้าต้องช่วยเหลือชาวเมืองอย่างน้อย 2 ครั้งก่อน จึงจะได้รับการยอมรับและเข้าถึงสถานที่สำคัญได้ เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "มีเด็กแมวสาวตัวหนึ่งชื่อเมี้ยวมินะ กำลังมีปัญหาแถวๆ ตลาดกลาง ลองไปดูสิว่าเธอต้องการความช่วยเหลืออะไร เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj6

      obj6:
        name_short: ภารกิจย่อยที่ 1
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &d[เริ่มภารกิจย่อยที่ 1]\n&6"ข้าวกล่องหาย!"
        goto: OBJECT obj7

      obj7:
        name_short: ไปพบเมี้ยวมินะที่ตลาดกลาง
        objective_detail: เดินทางไปพบเมี้ยวมินะบริเวณตลาดกลาง
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,2700,37,2807
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: market
        goto: OBJECT obj8

      obj8:
        name_short: พูดคุยกับเมี้ยวมินะ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณพบกับลูกแมวตัวเล็กๆ กำลังนั่งร้องไห้อยู่ที่มุมหนึ่งของตลาด'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "พี่คะ! เมี้ยววว~ หนูเผลอทำข้าวกล่องหายระหว่างทางมาเมือง ฮือ..."'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "เป็นข้าวกล่องพิเศษที่คุณแม่ทำให้หนู มีปลาแซลมอนด้านใน เมี้ยว~ แย่เลย! มันเป็นอาหารมื้อสำคัญสำหรับคุณยายที่กำลังป่วยของหนู"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "ใจเย็นๆ นะ พี่จะช่วยหาทางแก้ไขให้เอง"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT minachoice

      # ========== ทางเลือกสำหรับภารกิจของเมี้ยวมินะ ==========
      minachoice:
        name_long: >
          &aจะช่วยเมี้ยวมินะอย่างไรดี?
        objective_detail: |
          &7เลือกวิธีที่จะช่วยเมี้ยวมินะ
        start_delay: 3 SECOND
        type: DIVERGE_GUI
        reopen_delay: 5 SECOND
        choices:
          - slot: 11
            item:
              type: BUNDLE
              name: >
                &aตามหากล่องข้าวเดิม
              lore: |
                &7ช่วยเมี้ยวมินะตามหากล่องข้าวที่หายไป
                &7อาจใช้เวลานาน แต่จะได้กล่องข้าวคืน
                &7และคุณยายจะได้รับอาหารที่มีความหมาย
            goto: OBJECT find_lunchbox
          - slot: 15
            item:
              type: CRAFTING_TABLE
              name: >
                &aทำกล่องข้าวใหม่ให้
              lore: |
                &7ช่วยเมี้ยวมินะทำกล่องข้าวใหม่ทดแทน
                &7ต้องหาวัตถุดิบและปรุงอาหารใหม่
                &7เร็วกว่า และได้ทักษะการทำอาหารเพิ่ม
            goto: OBJECT make_lunchbox
      
      # ========== เส้นทางตามหากล่องข้าว ==========
      find_lunchbox:
        name_short: ตามหากล่องข้าวของเมี้ยวมินะ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "พี่จะช่วยตามหากล่องข้าวของหนูเอง! มันหายที่ไหนเป็นครั้งสุดท้ายที่หนูจำได้?"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "เมี้ยว~ หนูจำได้ว่าหนูเดินผ่านสวนเล็กๆ ใกล้โรงเตี๊ยมกิลด์ แล้วก็นั่งพักที่น้ำพุ หลังจากนั้นหนูก็เดินมาที่ตลาด..."'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "อาจจะหายที่ไหนสักแห่งตามเส้นทางนั้น เมี้ยววว~ รีบหน่อยนะพี่ คุณยายรออาหารอยู่!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเวลาจำกัด: 5 นาที!'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        hide_chat: true
        goto: OBJECT check_fountain

      check_fountain:
        name_short: มองหาข้าวกล่องที่น้ำพุ
        objective_detail: ไปตรวจสอบบริเวณน้ำพุใกล้โรงเตี๊ยมกิลด์
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-1226,69,-316
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: fountain
        goto: OBJECT no_lunchbox_fountain

      no_lunchbox_fountain:
        name_short: ค้นหาที่น้ำพุ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณตรวจสอบบริเวณน้ำพุอย่างละเอียด แต่ไม่พบกล่องข้าวของเมี้ยวมินะ'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "ไม่มีที่นี่... อาจจะอยู่ที่อื่นตามเส้นทาง ลองดูที่สวนข้างโรงเตี๊ยมดีกว่า"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        hide_chat: true
        goto: OBJECT check_garden

      check_garden:
        name_short: ค้นหาที่สวนเล็กๆ
        objective_detail: ไปตรวจสอบสวนเล็กๆ ใกล้โรงเตี๊ยมกิลด์
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-1240,68,-316
          radius: 5.0
        gps:
          enabled: true
          mode: GPS
          custom_point: small_garden
        goto: OBJECT find_lunchbox_garden

      find_lunchbox_garden:
        name_short: พบข้าวกล่องของเมี้ยวมินะ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณมองเห็นกล่องข้าวสีชมพูลายแมวน่ารักตกอยู่ใต้ม้านั่งในสวน!'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "นี่น่าจะใช่! กล่องข้าวของเมี้ยวมินะ!"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณเก็บกล่องข้าวขึ้นมา และรีบนำกลับไปให้เมี้ยวมินะ'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        hide_chat: true
        goto: OBJECT return_lunchbox

      return_lunchbox:
        name_short: นำกล่องข้าวกลับไปให้เมี้ยวมินะ
        objective_detail: นำกล่องข้าวกลับไปให้เมี้ยวมินะที่ตลาดกลาง
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,2700,37,2807
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: market
        goto: OBJECT complete_find_lunchbox

      complete_find_lunchbox:
        name_short: คืนกล่องข้าวให้เมี้ยวมินะ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &a%player_name% &f: "เมี้ยวมินะ! พี่เจอกล่องข้าวของหนูแล้ว! มันตกอยู่ใต้ม้านั่งในสวน"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "จริงเหรอคะ?! เมี้ยววว~! ขอบคุณมากเลยค่ะพี่! คุณยายจะดีใจมาก!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_purr
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเมี้ยวมินะรับกล่องข้าวด้วยความดีใจ และเปิดออกทันที'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "แซลมอน! ยังอยู่ครบเลย อร่อยจังเลย เมี้ยววว~! พี่เอานี่ไปเป็นของขอบคุณนะคะ!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเมี้ยวมินะมอบ "สติ๊กเกอร์เมี้ยวมินะ x5" และ "ข้าวกล่องพลังงาน +10" ให้คุณ'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "สติ๊กเกอร์นั่นเป็นคอลเลคชั่นพิเศษมากๆ เมี้ยว~ แล้วข้าวกล่องก็มีพลังงานพิเศษด้วยนะ!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณได้รับ &a+1 จุดความดี &fเนื่องจากช่วยตามหากล่องข้าวให้คุณยาย'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        hide_chat: true
        goto: OBJECT mina_quest_complete
        
      # ========== เส้นทางทำกล่องข้าวใหม่ ==========
      make_lunchbox:
        name_short: ทำกล่องข้าวใหม่ให้เมี้ยวมินะ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "การตามหากล่องข้าวคงใช้เวลานาน พี่มีไอเดียดีกว่า! เรามาทำข้าวกล่องใหม่ให้คุณยายกันเถอะ!"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a&lเมี้ยวมินะ &f: "เมี้ยว~? จริงเหรอคะ? แต่หนูไม่รู้จะหาวัตถุดิบที่ไหน..."'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "ไม่ต้องกังวล! พี่จะจัดการเอง ต้องใช้อะไรบ้างล่ะ?"'
          - 'SEND_MESSAGE &f'
