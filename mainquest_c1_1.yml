# -------------------- Display settings --------------------
display_name: "&fए &eเควสหลักเมืองโอเรแก๊น ที่ 1"
description: 
  - '&fऎ ความยาก : &aง่ายมาก'
  - '&f เลเวลแนะนำ : &a1+'
  - '&f &fรายการรางวัล:'
  - "&f &f &ax3 แต้มเควส"
  - "&f &f &ax0 ยังไม่ได้คิด"
  - "&f &f &ax0 ยังไม่ได้คิด"
  - '&f' 
  - '&c** แนะนำให้อ่านเควสดีๆนะครับ **'

start_notify:
  title: '&6คุณได้รับเควสใหม่'
  title_subtitle: '&fขณะนี้เควส {quest} ได้ถูกรับมาแล้ว&f!'
  sound: ENTITY_PLAYER_LEVELUP

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10143
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&c{quest}'
    lore: |
      &f{description}
      {completions}
      {last_completion}
      {cooldown}
      {detailed_progression}
      {detailed_errors}
  COOLDOWN:
    type: BARRIER
    name: '&c{quest}'
    lore: |
      &f{description}
      {completions}
      {last_completion}
      {cooldown}
      {detailed_progression}
      {detailed_errors}
      {controls}

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1000
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]

