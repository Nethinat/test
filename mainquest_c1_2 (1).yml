  - '&f &fรางวัลเควส &f'
  - "&e&l| &ax1 &fแต้มเควส"
  - "&e&l| &ax100 &fเงิน"
  - "&e&l| &ax300 &fค่าประสบการณ์"
  - "&e&l| &ax1 &eการ์ดภารกิจผจญภัย"
  - "&e&l| &ax2 &x&4&1&D&F&4&Dหญ้าเวทมนต์หยาดฟ้า"
  - "&e&l| &ax2 &x&4&1&D&F&4&Dกองแผ่นไม้"

start_notify:
  title: "&aดำเนินการเริ่มภารกิจ!!"
  sound: ENTITY_PLAYER_LEVELUP

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 11413
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&f &cภารกิจนี้ถูกล็อค &f'
    lore: |
      &c
      &eภารกิจเนื้อเรื่อง ฉบับที่ 2
      &c
      &cหากต้องการปลดล็อคภารกิจนี้ ผู้เล่นต้องสำเร็จภารกิจ
      &fฝันร้ายที่ไม่อาจลืมเลือน (บทเปิด)
      &cให้สำเร็จเสียก่อน ภารกิจนี้จึงจะปลดล็อค
  COOLDOWN:
    type: BARRIER
    name: '&f &cท่านได้ทำภารกิจนี้ไปแล้ว &f'
    lore: |
      &c
      &cท่านได้ทำภารกิจนี้สำเร็จแล้ว จึงไม่สามารถรับภารกิจนี้ซ้ำได้

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1
  notify:
    SUCCESS:
      title: '&aภารกิจสำเร็จแล้ว'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 1 HOUR
  end_types: [SUCCESS]

