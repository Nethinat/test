# -------------------- Display settings --------------------
display_name: "&eภารกิจ &fคำแนะนำจากซานนา"
description:
  - '&f'
  - "&e&l| &eภารกิจเนื้อเรื่อง ฉบับที่ 2"
  - '&f'
  - '&7เป้าหมายภารกิจ'
  - "&e&l| &fฟังคำแนะนำทั้งหมดจากซานนาที่จะแนะนำเกี่ยวกับเมือง"
