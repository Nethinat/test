          &a
          &a%player_name% &f: &fฉันเสียใจที่ได้ยินเช่นนั้น ฉันจะช่วยได้อย่างไร
          &a
          &aแฮงก์ &f: &fฉันได้ยินมาว่าคุณเป็นนักผจญภัยที่มีความสามารถ
