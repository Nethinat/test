          &aแฮงก์ &f: &fฉันต้องการขอให้คุณช่วยฉันรวบรวมเสบียง
          &a
          &aแฮงก์ &f: &fฉันต้องการอุปกรณ์ทางการแพทย์พื้นฐานเพื่อจัดการกับอาการบาดเจ็บ
