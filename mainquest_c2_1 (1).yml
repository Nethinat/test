        name_short: พบกับ ทามิ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fโหะๆ... เจ้าหามอนเตอร์แปลกปลาดอยู่หรอ'
