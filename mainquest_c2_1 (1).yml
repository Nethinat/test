          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aชาวเมือง: &fอือ... ไม่เคยนะมอนเตอร์อะไรละนั้น 5555'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aชาวเมือง: &fข้าไปละอย่าพึ่งมายุ่งกับข้า'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj3

