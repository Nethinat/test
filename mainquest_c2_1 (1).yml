        name_short: นำ&x&4&1&D&F&4&Dกองแผ่นไม้ &f128 อัน ไปให้ Gul ที่หมู่บ้านทะเลทรายเล็กม้วก
        objective_detail: นำ&x&4&1&D&F&4&Dกองแผ่นไม้ &f128 อัน ไปให้ Gul ที่หมู่บ้านทะเลทรายเล็กม้วก
