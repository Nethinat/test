    type: PAPER
    custom_model_data: 10753
    name: '&f &cเควสนี้ถูกล็อค &f'
    lore: |
      &cหากต้องการปลดล็อคเควสต้องทำเควสก่อนหน้าให้เสร็จก่อน
  COOLDOWN:
    type: PAPER
    custom_model_data: 10754
    name: '&f &cท่านได้ทำเควสนี้ไปแล้ว &f'

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1000
  notify:
    SUCCESS:
      title: '⻠七⻡'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]


branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fคุณได้นอนพักที่เมืองทูนาเรีย \nและกำลังสอบถามเกี่ยวมอนเตอร์แปลกปลาดที่ได้ยินมา
        goto: OBJECT obj2_2

      obj2_2:
        name_short: เดินไปถามคนในหมู่บ้าน
        objective_detail: เดินไปถามคนในหมู่บ้านเกี่ยวกับมอนเตอร์แปลกปลาด -719,72,-381
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-719,72,-381
          radius: 3.0 
        gps:
          enabled: true
          mode: GPS
          custom_point: tami
        goto: OBJECT obj2

      obj2:
        name_short: สอบถามชาวเมือง
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fนี่เจ้า เคยได้ยินเกี่ยวกับมอนเตอร์แปลกปลาดมั้ย'
