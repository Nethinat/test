          - 'SEND_MESSAGE &f &aGul: &fเจ้าช่างเป็นคนดีและมีน้ำใจจริงๆ'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fไม่เป็นไรครับ ยินดีที่ได้ช่วย'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fเอาล่ะ ตอนนี้ข้าจะบอกเรื่องปีศาจตาฟ้าให้เจ้าฟัง'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fแต่เรื่องนี้ยาวมาก เราค่อยคุยกันในภารกิจต่อไปดีกว่า'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fได้ครับ ขอบคุณมากครับ Gul'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fไม่เป็นไร แล้วพบกันใหม่ในภารกิจหน้านะ!'
          - 'SEND_MESSAGE &a'
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
