          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fมันมีก็อปบินอยู่'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fแค่เจ้าเดินทางไปที่ข้าบอกมันจะเจอเอง'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fระวังข้างหลัง !!!!!!!'
          - 'SEND_MESSAGE &a'
