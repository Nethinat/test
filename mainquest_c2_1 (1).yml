        gps:
          enabled: true
          mode: GPS
          custom_point: gui  # ปรับ custom point ตามต้องการ
        goto: OBJECT obj11 
      
      obj11:
        name_short: พบกับชายนิรนาม
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fขอบคุณมากที่ช่วยหากองแผ่นไม้มาให้'
