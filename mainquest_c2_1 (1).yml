          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fใช่เลย ข้ากำลังตามหา'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fเจ้ายังไม่รู้สินะว่ามันมีจริงหรือไม่จริง'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fเจ้าก็คงคิดอยู่สินะว่าข้ารู้ได้อย่างไร'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aทามิ: &fงั้นเจ้าก็ควรให้อะไรที่สมน้ำสมเนื้อให้ข้าสิ'
