# -------------------- Display settings --------------------
display_name: "&f &fนักพจญภัยนิรนาม"
description: 
  - '&f'
  - '&f &aเควสหลักเมืองทูนาเรีย I'
  - '&fऎ ระดับความยาก : &f'
  - '&f'
  - '&7เป้าหมายเควส : ตามหามอนเตอร์แปลกปลาด'
  - '&f'
  - '&f &fรางวัลเควส'
  - "&f &f &ax1 &fแต้มเควส"
  - "&f &f &ax150 &fค่าประสบการณ์"
  - "&f &f &ax1 &fตราสัญลักษณ์รับรองนักเดินทาง"
  - "&f &f &ax16 &fขนมปัง"
  - '&f' 
  - '&fऑ คลิ๊กขวาเพื่อรับเควส'

start_notify:
  title: "⻨七⻩"
  sound: ENTITY_PLAYER_LEVELUP

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10752
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
