# -------------------- รางวัลเควส settings --------------------

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            AQUA
            BLUE
          fade_colors: |
            AQUA
            BLUE
          flicker: true
          trail: true
      count: 1
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |  # the commands to perform #fix here
        qc points %player_name% add 1 global
        mmocore admin exp give %player_name% main 50
        mi give MATERIAL QUEST_0 %player_name% 1 
      as_player: false