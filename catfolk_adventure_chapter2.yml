      obj26:
        name_short: เตรียมออกเดินทาง
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณได้เรียนรู้ความจริงที่น่าประหลาดใจเกี่ยวกับมังกรสายหมอกและผู้พิทักษ์ทั้งเจ็ด'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fตอนนี้คุณต้องตามหาชิ้นส่วนกุญแจแมวแห่งสายหมอกทั้งสามชิ้น โดยเริ่มจากห้องสมุดโบราณ'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fแต่โปรดระวัง... "กรงเล็บแห่งความมืด" กำลังเคลื่อนไหวอยู่ในเงามืด'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &f...'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเรื่องราวการตามหากุญแจทั้งสามจะดำเนินต่อในบทต่อไป...'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj27

      obj27:
        name_short: บทสรุป
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &dจบบทที่ 2\n&eติดตามการผจญภัยได้ในบทต่อไป
        goto: QUEST_SUCCESS

