# -------------------- Display settings --------------------
display_name: "&e&lบทที่ 2 &f– &6ตำนานทั้งเจ็ด"
description: 
  - '&fऎ ความยาก : &6ปานกลาง'
  - '&f เลเวลแนะนำ : &a5+'
  - '&f'
  - '&7เป้าหมายภารกิจ'
  - "&e&l| &fสืบหาความจริงเกี่ยวกับรีเจ้นดารี่เอ็กตร้าบอสและถ้ำศักดิ์สิทธิ์"
  - '&f'
  - '&f &fรางวัลเควส &f'
  - "&e&l| &ax7 &fแต้มเควส"
  - "&e&l| &ax250 &fเงิน"
  - "&e&l| &ax450 &fค่าประสบการณ์"
  - "&e&l| &ax1 &eแผนที่ถ้ำศักดิ์สิทธิ์"
  - "&e&l| &ax1 &eเศษขนมังกรสายหมอก"
  - "&e&l| &ax3 &x&4&1&D&F&4&Dหญ้าเวทมนต์หยาดฟ้า"
  - '&f' 
  - '&c** เควสนี้จำเป็นต้องผ่านบทที่ 1 ก่อน **'

start_notify:
  title: '&6การผจญภัยดำเนินต่อไป'
  title_subtitle: '&fคุณได้เริ่มบทที่ 2: ตำนานทั้งเจ็ด!'
  sound: ENTITY_CAT_PURR

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10144
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&f &cภารกิจนี้ถูกล็อค &f'
    lore: |
      &c
      &eภารกิจเนื้อเรื่องบทที่ 2
      &c
      &cหากต้องการปลดล็อคภารกิจนี้ คุณต้องสำเร็จภารกิจ
      &fบทที่ 1 – จุดเริ่มต้นของการผจญภัย
      &cให้สำเร็จเสียก่อน
  COOLDOWN:
    type: BARRIER
    name: '&f &cท่านได้ทำภารกิจนี้ไปแล้ว &f'
    lore: |
      &c
      &cท่านได้ทำภารกิจนี้สำเร็จแล้ว จึงไม่สามารถรับภารกิจนี้ซ้ำได้

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_CAT_PURR
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: ENTITY_CAT_HISS
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: ENTITY_CAT_HISS
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]

# -------------------- Quest content --------------------

branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        name_short: เริ่มบทที่ 2
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &dบทที่ 2 – ตำนานทั้งเจ็ด\n&fการผจญภัยดำเนินต่อไป
        goto: OBJECT obj2

      obj2:
        name_short: เนื้อเรื่องเปิดตัว
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 100
          - 'SEND_MESSAGE &f &6[ระบบ]: &fพระอาทิตย์เริ่มคล้อยต่ำ เสียงนกร้องดังแผ่ว ๆ ท่ามกลางบรรยากาศอบอุ่นของเมืองแมวนคร'
          - 'SEND_MESSAGE &f &6[ระบบ]: &f%player_name% กลับมายังโรงเตี๊ยม พร้อมหัวใจที่เต้นแรง หลังพบ "ถ้ำลึกลับ" ที่ไม่สามารถเข้าได้'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 80
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj3

      obj3:
        name_short: พบกับเนียบิว ที่โรงเตี๊ยม
        objective_detail: กลับมาที่โรงเตี๊ยมเพื่อพบกับเนียบิว
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2700,36,2785  # แก้ไขพิกัดตามแมพของคุณ - โรงเตี๊ยม
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: tavern
        goto: OBJECT obj4

      obj4:
        name_short: พูดคุยกับเนียบิว
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &b&lเนียบิว &f: "กลับมาแล้วเหรอจ๊ะ เมี้ยววว~ ดูหน้าตื่นเต้นจังเลย?"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "ครับ/ค่ะ ผม/ดิฉันเจอถ้ำอะไรบางอย่างข้างนอกเมือง มันมีพลังแปลกๆ เหมือนกับว่าข้างในมีอะไรบางอย่างซ่อนอยู่..."'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเนียบิว เงียบไปครู่หนึ่ง ก่อนจะพูดด้วยน้ำเสียงจริงจัง'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ถ้าอย่างนั้น... เธอคงได้กลิ่นอายของ ''หนึ่งในเจ็ด'' แล้วล่ะนะ เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj5

      obj5:
        name_short: เรียนรู้เกี่ยวกับตำนาน
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "หนึ่งในเจ็ด?"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ใช่เมี้ยววว~... ตำนานเล่าว่า มีสัตว์อสูรโบราณถูกผนึกไว้ในถ้ำศักดิ์สิทธิ์ทั้ง 7 แห่ง ทั่วดินแดน Wipcream Skyland นี้..."'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "พวกมันคือ ''รีเจ้นดารี่เอ็กตร้าบอส'' มอนสเตอร์ระดับตำนานที่เคยทำลายล้างโลกเมื่อพันปีก่อน เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ทั้ง 7 ตัว ถูกผนึกไว้ใน 7 เมืองใหญ่ โดยมีไอเทมหายากเป็นกุญแจไขถ้ำ เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ไอเทมนั้นจะปรากฏเฉพาะเมื่อผู้เล่นเดินตามเนื้อเรื่องของแต่ละเมืองเท่านั้น เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj6

      obj6:
        name_short: คำถามเกี่ยวกับถ้ำ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "งั้น...หมายความว่าถ้ำที่ผม/ดิฉันเจอ ก็คือหนึ่งในนั้น?"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ถูกต้องเมี้ยววว~ นั่นคือถ้ำของ ''วาร์มิล่า – มังกรสายหมอก'' บอสประจำเมืองแมวนคร"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ไม่มีใครเคยล้มมันได้ เพราะไม่มีใครเคยได้ ''เกล็ดมังกรสายหมอก'' ไอเทมที่จำเป็นสำหรับเข้าสู้บอสตัวนี้ เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "...แล้วจะหาไอเทมนั้นได้ยังไงครับ/คะ?"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &b&lเนียบิว &f: "เล่นเนื้อเรื่องหลักของเมืองนี้ให้จบ เธอจะได้เงื่อนงำทีละนิด... แล้วสักวันหนึ่ง เธอจะได้มันเอง เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj7

      obj7:
        name_short: อัพเดทเควส
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &d[อัปเดตเควสต์เนื้อเรื่องหลัก]\n&6"ตำนานแห่งสายหมอก"
        goto: OBJECT obj8

      obj8:
        name_short: รับเควสตำนานแห่งสายหมอก
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &b&lเนียบิว &f: "ถ้าเธอจริงจังกับการเดินทางสายนี้ อย่าลืมว่า เธอจะต้องเดินทางผ่านทั้ง 7 เมือง เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &b&lเนียบิว &f: "และเผชิญหน้ากับรีเจ้นดารี่เอ็กตร้าบอสทั้ง 7 ตัว ที่ถูกผนึกไว้ในเมืองต่างๆ... เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &b&lเนียบิว &f: "แต่ตอนนี้... เริ่มจากเมืองนี้ก่อนเถอะ เมี้ยว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &b&lเนียบิว &f: "มีข่าวลือว่ามีลูกแมวในเมืองตัวหนึ่งเคยเห็นแสงประหลาดลอยออกมาจากซากหอคอยโบราณทางตะวันตก ลองไปสำรวจกันดูไหม? เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &a%player_name% &f: "ได้ครับ/ค่ะ ผม/ดิฉันจะไปเดี๋ยวนี้เลย!"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 50
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_CAT_PURR
        hide_chat: true
        goto: OBJECT obj9

      obj9:
        name_short: เริ่มภารกิจแสงจากอดีต
        type: SERVER_COMMANDS_PERFORM
        commands: |
          cmi titlemsg %player_name% &d[เริ่มภารกิจเนื้อเรื่อง]\n&6"แสงจากอดีต"
        goto: OBJECT obj10

      obj10:
        name_short: เดินทางไปยังหอคอยโบราณ
        objective_detail: เดินทางไปยังซากหอคอยโบราณทางตะวันตกของเมือง
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2600,45,2750  # แก้ไขพิกัดตามแมพของคุณ - หอคอยโบราณ
          radius: 10.0
        gps:
          enabled: true
          mode: GPS
          custom_point: ancient_tower
        goto: OBJECT obj11

      obj11:
        name_short: สำรวจหอคอยโบราณ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &6[ระบบ]: &fคุณเดินทางมาถึงซากหอคอยโบราณ สถานที่นี้ดูเก่าแก่และถูกทิ้งร้างมานาน'
          - 'SEND_MESSAGE &f &6[ระบบ]: &fแม้จะเป็นเพียงซากปรักหักพัง แต่คุณยังรู้สึกได้ถึงพลังบางอย่างที่ซ่อนอยู่ในที่นี่'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "นี่คือหอคอยโบราณที่เนียบิวพูดถึงสินะ..."'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fขณะที่คุณกำลังสำรวจอยู่นั้น คุณได้ยินเสียงเล็กๆ ดังมาจากมุมหนึ่งของหอคอย'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: AMBIENT_CAVE
        hide_chat: true
        goto: OBJECT obj12

      obj12:
        name_short: พบกับลูกแมวผู้ลึกลับ
        objective_detail: เข้าไปตรวจสอบเสียงที่ได้ยิน
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2595,45,2745  # แก้ไขพิกัดตามแมพของคุณ - มุมของหอคอย
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: tower_corner
        goto: OBJECT obj13

      obj13:
        name_short: พูดคุยกับเมี้ยวมิ้น
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเมื่อคุณเดินไปถึงมุมนั้น คุณพบกับลูกแมวตัวเล็กๆ กำลังนั่งอยู่'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "เมี้ยววว~ มีคนมาที่นี่ด้วยเหรอ? ไม่ค่อยมีใครมาที่นี่หรอกนะ"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &a%player_name% &f: "สวัสดีน้อง ฉันชื่อ %player_name% มาที่นี่เพราะได้ยินว่า มีคนเห็นแสงประหลาดที่หอคอยนี้น่ะ"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "โอ้! เมี้ยว~ นั่นคือฉันเองล่ะ! ฉันชื่อเมี้ยวมิ้น! ฉันเห็นแสงประหลาดที่นี่จริงๆ นะ!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "แสงสีฟ้าอมม่วง ลอยวนอยู่แถวๆ ห้องใต้ดินของหอคอยนี้ เมี้ยววว~"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "แต่ฉันไม่กล้าลงไปคนเดียวหรอก เมี้ยว~ มันน่ากลัว..."'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj14

      obj14:
        name_short: เสนอความช่วยเหลือ
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 40
          - 'SEND_MESSAGE &a%player_name% &f: "งั้นเรามาสำรวจด้วยกันไหม? ฉันจะช่วยเธอหาว่าแสงประหลาดนั่นคืออะไร"'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "จริงเหรอเมี้ยววว~? ดีจังเลย! เดี๋ยวฉันพาไปที่ทางเข้าห้องใต้ดินเลย!"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &f &6[ระบบ]: &fเมี้ยวมิ้นกระโดดลงจากที่นั่งอย่างตื่นเต้น แล้วเริ่มพาคุณไปยังอีกด้านของหอคอย'
          - 'SEND_MESSAGE &f'
          - WAIT_TICKS 60
        complete_notify:
          sound: ENTITY_CAT_AMBIENT
        hide_chat: true
        goto: OBJECT obj15

      obj15:
        name_short: ตามเมี้ยวมิ้นไปยังทางเข้าห้องใต้ดิน
        objective_detail: ตามเมี้ยวมิ้นไปยังทางเข้าห้องใต้ดิน
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2605,40,2760  # แก้ไขพิกัดตามแมพของคุณ - ทางเข้าห้องใต้ดิน
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: basement_entrance
        goto: OBJECT obj16

      obj16:
        name_short: พบทางเข้าห้องใต้ดิน
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &5&lเมี้ยวมิ้น &f: "นี่ไง เมี้ยววว~! ทางเข้าห้องใต้ดิน! ฉันเคยเห็นแสงประหลาดลอยขึ้นมาจากตรงนี้"'
          - 'SEND_MESSAGE &f'
