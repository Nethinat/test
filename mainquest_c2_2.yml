# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1000
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]
  
# -------------------- Quest content --------------------

branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        # display
        name_short: คุยกับรูบี้ ที่หมูบ้านกิงค์
        objective_detail: คุยกับรูบี้ ที่หมูบ้านกิงค์
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2386,81,2860 #TODO fix right position
          radius: 5.0 #TODO change later
        goto: OBJECT obj2
## บทพูด
      obj2:
        name_short: เนื้อเรื่อง (กดที่ตัว NPC ได้เลยครับ)
        type: PLAYER_CITIZENS_NPC_DIALOG
        npc: 27
        click_types: [LEFT_CLICK, RIGHT_CLICK]
        messages: |
          &a%player_name% &f: &fรูบี้ ไหนว่าไงต่อ
          &a
          &aรูบี้ &f: &fหลักจากที่ฉันส่งคนไปตรวจสอบ
          &a
          &aรูบี้ &f: &fฉันได้ข้อมูลตัวอย่างมา
          &a
          &aรูบี้ &f: &fชึ่งฉันต้องการตัวอย่างนี้เพิ่มอีก
          &a
          &aรูบี้ &f: &fสิ่งนี้ชื่อว่า &eกลีบดอกบักแห่งกิงค์ 
          &a
          &aรูบี้ &f: &fพื้นที่ ที่หามันได้อยู่บนดอกบัวยักย์นั้นไง
          &a
          &a%player_name% &f: &fแล้วฉันจะขี้นไปบนนั้นได้ไงรึ?
          &a
          &aรูบี้ &f: &fคนของฉันเจอทางขึ้น เดี๋ยวฉันจะให้พิกัด
          &a
          &a%player_name% &f: ขอบคุณมากๆ เดี๋ยวฉันไปหาให้
          &a
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj3

      obj3:
        # display
        name_short: ลงเช็คพื้นที่ ดอกบัวที่มีขนาดใหญ่
        objective_detail: ลงเช็คพื้นที่ ดอกบัวที่มีขนาดใหญ่
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2259,96,2971 #TODO fix right position 2259 96 2971
          radius: 5.0 #TODO change later
        goto: OBJECT obj4

      obj4:
        name_short: คําแนะนํา
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &c[!] &f: คําแนะนําในการเดินเควสนี้!!'
          - 'SEND_MESSAGE &a'
          - SEND_SOUND entity_villager_trade
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &c[!] &f: มองไปด้านหน้าท่านจะเห็น ท่อนไม้'
          - 'SEND_MESSAGE &a'
          - SEND_SOUND entity_villager_trade
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &c[!] &f: ทําการกระโดดตามท่อนไม้ได้เลย'
          - 'SEND_MESSAGE &a'
          - SEND_SOUND entity_villager_trade
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj5

      obj5:
        name_short: นำ &fกลีบดอกบักแห่งกิงค์ 10 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์
        objective_detail: นำ &fกลีบดอกบักแห่งกิงค์ 10 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์
        type: PLAYER_CITIZENS_NPC_INTERACT
        npc: 27
        items_needed:
          items:
            - item:
                type: paper
                custom_model_data: 10104
              check: SameBase
              goal: 10
          take: true
          error_message: '&c[!] &7: นำ &fกลีบดอกบักแห่งกิงค์ 10 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์'
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        goto: OBJECT obj7

      obj7:
        name_short: เนื้อเรื่อง (กดที่ตัว NPC ได้เลยครับ)
        type: PLAYER_CITIZENS_NPC_DIALOG
        npc: 27
        click_types: [LEFT_CLICK, RIGHT_CLICK]
        messages: |
          &a%player_name% &f: &fฉันหามาได้แค่นี้ รูบี้ พอมั้ย
          &a
          &aรูบี้ &f: &fจากที่ดูมา นายหาเก่งกว่าที่ฉันคิดอีกนะเนี้ย
          &a
          &aรูบี้ &f: &fขอบคุณสําหรับการช่วยเหลือของนายมากนะ
          &a
          &aรูบี้ &f: &fเดี๋ยวฉันจะติดต่อนายไปอีกนะ
          &a
          &aรูบี้ &f: &fหลังจากฉันวิจัยงานนี้่เสร็จ
          &a
          &a%player_name% &f: &fได้เลยรูบี้
          &a
          &a%player_name% &f: แล้วเจอกันใหม่
          &a
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: QUEST_SUCCESS
# -------------------- รางวัลเควส settings --------------------

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            AQUA
            BLUE
          fade_colors: |
            AQUA
            BLUE
          flicker: true
          trail: true
      count: 1
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |  # the commands to perform
        qc points %player_name% add 5 global
        mmocore admin exp give %player_name% main 150
        mi give MATERIAL FASION1 %player_name% 1
        mi give MATERIAL DMMO1 %player_name% 1
      as_player: false
     