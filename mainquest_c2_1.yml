# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1000
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]
  
# -------------------- Quest content --------------------

branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        # display
        name_short: คุยกับรูบี้ ที่หมูบ้านกิงค์
        objective_detail: คุยกับรูบี้ ที่หมูบ้านกิงค์
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2386,81,2860 #TODO fix right position
          radius: 5.0 #TODO change later
        goto: OBJECT obj2
## บทพูด
      obj2:
        name_short: เนื้อเรื่อง (กดที่ตัว NPC ได้เลยครับ)
        type: PLAYER_CITIZENS_NPC_DIALOG
        npc: 27
        click_types: [LEFT_CLICK, RIGHT_CLICK]
        messages: |
          &a%player_name% &f: &fรูบี้ เห็นว่ามีงานให้ผมทํา ผมพร้อมล่ะ
          &a
          &aรูบี้ &f: &fมีพื้นที่ใหม่เพิ่งเปิดขึ้น
          &a
          &aรูบี้ &f: &fพื้นที่ใหม่มีดอกบัวที่มีขนาดใหญ่เป็นเอกลักษณ์
          &a
          &aรูบี้ &f: &fแต่มีรายงานว่ามียักษ์ในพื้นที่ที่อาจก่อให้เกิดความเสี่ยงต่อ นักเดินทาง
          &a
          &aรูบี้ &f: &fฉันแนะนำให้ไปกำจัดมอนสเตอร์ 50 ตัวเพื่อให้คนในพื้นที่ปลอดภัย
          &a
          &aรูบี้ &f: &fในพื้นที่นั่นอันตรายมากนะระวังด้วย
          &a
          &a%player_name% &f: &fได้เลยเดี๋ยวฉันจะไปลงพื่นที่นะ
          &a
          &aรูบี้ &f: &fขอให้เดินทางปลอดภัยและโชคดีกับการเคลื่อนไหวของคุณนะคะ
          &a
          &a%player_name% &f: เช่นกัน
          &a
          &aรูบี้ &f: &fเดี๋ยวฉันให้ โพชั่นไปล่ะกัน
          &a
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj3

      obj3:
        name_short: หยิบโพชั่นจากกระเป๋า
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          mi give CONSUMABLE HEAL_1 %player_name% 10
        goto: OBJECT obj4
      
      obj4:
        # display
        name_short: ลงเช็คพื้นที่ ดอกบัวที่มีขนาดใหญ่
        objective_detail: ลงเช็คพื้นที่ ดอกบัวที่มีขนาดใหญ่
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2301,94,2981 #TODO fix right position 2301 94 2981
          radius: 5.0 #TODO change later
        goto: OBJECT pick

      pick:
        name_long: >
          &aตัดสินใจว่าจะฟามตัวไหน
        objective_detail: |
          &7ตัดสินใจว่าจะฟามตัวไหน
        start_delay: 3 SECOND
        type: DIVERGE_GUI
        reopen_delay: 5 SECOND
        choices:
          - slot: 12
            item:
              type: YELLOW_CANDLE
              name: >
                &aฉันจะฟาม โกเลมทราย
            goto: OBJECT pick1
          - slot: 14
            item:
              type: PURPLE_CANDLE
              name: >
                &aฉันจะฟาม ดอกไม้ปีศาจ
            goto: OBJECT pick2
        
      pick1:
        name_short: กำจัด &fโกเลมทราย &a{objective_progression}/&a{objective_goal}
        objective_detail: กำจัด &fโกเลมทราย &a{objective_progression}/&a{objective_goal}
        type: PLAYER_MYTHICMOBS_MOBS_KILL
        goals:
          a:
            mobs: ["mmo_mob2_2"]
            goal: 40
        goto: OBJECT obj5
      
      pick2:
        name_short: กำจัด &fดอกไม้ปีศาจ &a{objective_progression}/&a{objective_goal}
        objective_detail: กำจัด &fดอกไม้ปีศาจ &a{objective_progression}/&a{objective_goal}
        type: PLAYER_MYTHICMOBS_MOBS_KILL
        goals:
          a:
            mobs: ["mmo_mob2_1"]
            goal: 40
        goto: OBJECT obj5

      obj5:
        # display
        name_short: นําหลักฐานไปส่งให้ รูบี้แห่งหมู่บ้านกิงค์ 
        objective_detail: นําหลักฐานไปส่งให้ รูบี้แห่งหมู่บ้านกิงค์ 
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2386,81,2860 #TODO fix right position 2386 81 2860
          radius: 5.0 #TODO change later
        goto: OBJECT obj6

      obj6:
        name_short: นำ &fเกสรดอกปีศาจ 60 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์
        objective_detail: นำ &fเกสรดอกปีศาจ 60 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์
        type: PLAYER_CITIZENS_NPC_INTERACT
        npc: 27
        items_needed:
          items:
            - item:
                type: paper
                custom_model_data: 10095
              check: SameBase
              goal: 60
          take: true
          error_message: '&c[!] &7: นำ &fเกสรดอกปีศาจ 60 อัน&7ไปส่งที่รูบี้แห่งหมูบ้านกิงค์'
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        goto: OBJECT obj7

      obj7:
        name_short: เนื้อเรื่อง (กดที่ตัว NPC ได้เลยครับ)
        type: PLAYER_CITIZENS_NPC_DIALOG
        npc: 27
        click_types: [LEFT_CLICK, RIGHT_CLICK]
        messages: |
          &a%player_name% &f: &fเสร็จแล้ว รูบิ้
          &a
          &aรูบี้ &f: &fเก่งมาก ฉันคิดว่าวันนี้นายไปพักได้เลย
          &a
          &aรูบี้ &f: &fเดี๋ยวฉันจะส่งคนไปตรวจเพิ่มเติมเกี่ยวกับ
          &a
          &aรูบี้ &f: &fดอกบัวที่มีขนาดใหญ่
          &a
          &a%player_name% &f: &fได้เลยเดี๋ยวฉันมา ช่วยต่อหลังจากนี้
          &a
          &aรูบี้ &f: &fพักผ่อนเยอะๆ นะ 
          &a
          &a%player_name% &f: 
          &a
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: QUEST_SUCCESS
# -------------------- รางวัลเควส settings --------------------

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            AQUA
            BLUE
          fade_colors: |
            AQUA
            BLUE
          flicker: true
          trail: true
      count: 1
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |  # the commands to perform
        qc points %player_name% add 5 global
        mmocore admin exp give %player_name% main 150
        mi give MATERIAL FASION1 %player_name% 1
        mi give MATERIAL DMMO1 %player_name% 1
      as_player: false