          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj6

      obj6:
        name_short: เดินทางไปยัง เหมืองเก่าหุบเขาทองคํา
        objective_detail: เดินทางไปยัง เหมืองเก่าหุบเขาทองคํา -843,77,60
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-843,77,60
          radius: 5.0
        gps:
          enabled: true
          mode: GPS
          custom_point: dun2
        goto: OBJECT obj7

      obj7:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
