# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1000
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 12000 HOUR
  end_types: [SUCCESS]
  
# -------------------- Quest content --------------------

branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        # display
        name_short: คุยกับ เอสคานอร์ ถามเรื่องงานที่จะจ้าง
        objective_detail: คุยกับ เอสคานอร์ ถามเรื่องงานที่จะจ้าง
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mmo,2596,55,2960 #TODO fix right position 2596 55 2960
          radius: 5.0 #TODO change later
        goto: OBJECT obj2
## บทพูด
      obj2:
        name_short: เนื้อเรื่อง (กดที่ตัว NPC ได้เลยครับ)
        type: PLAYER_CITIZENS_NPC_DIALOG
        npc: 20
        click_types: [LEFT_CLICK, RIGHT_CLICK]
        messages: |
          &a%player_name% &f: &fเอสคานอร์ ว่าไงเห็นว่ามีงานให้ผมทํา
          &a
          &aเอสคานอร์ &f: &fฉันกำลังมองหาคนที่สามารถช่วยฉันส่งสินค้าจากเมืองอื่นได้ คุณรู้จักใครที่สามารถทำเช่นนั้นได้
          &a
          &a%player_name% &f: &fจริงๆ แล้ว ฉันสามารถช่วยคุณได้ คุณต้องการจัดส่งสินค้าประเภทใดและไปที่ไหน
          &a
          &aเอสคานอร์ &f: &fฉันต้องการส่งอุปกรณ์&และอาหารบางอย่างไปยังสำนักงานย่อยที่ หมูบ้านกิงค์
          &a
          &aเอสคานอร์ &f: &fเข้าใจแล้ว ฉันมีเพื่อนที่ให้บริการจัดส่งและสามารถจัดการให้คุณได้ คุณต้องการจัดส่งสินค้าเมื่อใด
          &a
          &aเอสคานอร์ &f: &fตามหลักการแล้ว ภายในสามวันถัดไป
          &a
          &a%player_name% &f: &fไม่มีปัญหา ฉันจะจัดส่งให้เลย
          &a
          &aเอสคานอร์ &f: คงจะดีมาก ขอบคุณมากสำหรับความช่วยเหลือของคุณ
          &a
          &aเอสคานอร์ &f: &fขอขอบคุณสําหรับความช่วยเหลือของคุณมากๆ
          &a
          &a%player_name% &f: ไม่เป็นไรครับพรี่
          &a
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj3

