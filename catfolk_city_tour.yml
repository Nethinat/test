# -------------------- Display settings --------------------
display_name: "&eภารกิจ &fทัวร์เมืองกับแมวน้อย"
description: 
  - '&f'
  - "&e&l| &eภารกิจเนื้อเรื่อง เผ่าแมว"
  - '&f'
  - '&7เป้าหมายภารกิจ'
  - "&e&l| &fเรียนรู้เกี่ยวกับเมืองจากมุมมองของเผ่าแคทฟอล์ค"
  - '&f'
  - '&f &fรางวัลเควส &f'
  - "&e&l| &ax5 &fแต้มเควส"
  - "&e&l| &ax150 &fเงิน"
  - "&e&l| &ax300 &fค่าประสบการณ์"
  - "&e&l| &ax1 &eการ์ดภารกิจผจญภัย"
  - "&e&l| &ax1 &eวัตถุดิบแฟชั่นแมว"
  - "&e&l| &ax1 &eวัตถุดิบพิเศษ MMO"
  - "&e&l| &ax2 &x&4&1&D&F&4&Dหญ้าเวทมนต์หยาดฟ้า"

start_notify:
  title: '&6คุณได้รับเควสใหม่'
  title_subtitle: '&fขณะนี้เควส {quest} ได้ถูกรับมาแล้ว&f!'
  sound: ENTITY_CAT_PURR

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10143
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&c{quest}'
    lore: |
      &f{description}
      {completions}
      {last_completion}
      {cooldown}
      {detailed_progression}
      {detailed_errors}
  COOLDOWN:
    type: BARRIER
    name: '&c{quest}'
    lore: |
      &f{description}
      {completions}
      {last_completion}
      {cooldown}
      {detailed_progression}
      {detailed_errors}
      {controls}

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1
  notify:
    SUCCESS:
      title: '&aภารกิจ เสร็จสิ้น'
      title_subtitle: '&fคุณได้ทำภารกิจ &a{quest} &fสำเร็จแล้ว!'
      sound: ENTITY_CAT_PURR
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: ENTITY_CAT_HISS
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: ENTITY_CAT_HISS
      
cooldown:
  duration: 24 HOUR
  end_types: [SUCCESS]

