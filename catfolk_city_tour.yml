# -------------------- รางวัลเควส settings --------------------

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            PURPLE
            PINK
          fade_colors: |
            AQUA
            WHITE
          flicker: true
          trail: true
      count: 3
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |  # the commands to perform
        qc points %player_name% add 5 global
        eco give %player_name% 150
        mmocore admin exp give %player_name% main 300
        mi give MATERIAL FASION1 %player_name% 1
