        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-503,77,-345
          radius: 3.0 
        gps:
          enabled: true
          mode: GPS
          custom_point: jing
        goto: OBJECT obj9

      obj9:
        name_short: นำ &fหนังของปิศาจต้องสาป &f300 อัน ไปให้ ชายบาดเจ็บ ที่พิกัด -503,77,-345
        objective_detail: นำ &fหนังของปิศาจต้องสาป &f300 อัน ไปให้ ชายบาดเจ็บ ที่พิกัด -503,77,-345
        type: PLAYER_CITIZENS_NPC_INTERACT
        npc: 63  # ปรับ NPC ID ตามต้องการ
        items_needed:
          items:
            - item:
                type: paper
                custom_model_data: 10283 # ต้องตรงกับ obj9
              check: SameBase
              goal: 300
          take: true
          error_message: '&c[!] &7: นำ &fหนังของปิศาจต้องสาป &f300 อัน ไปให้ ชายบาดเจ็บ ที่พิกัด -503,77,-345'
