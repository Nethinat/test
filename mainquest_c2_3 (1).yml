  - '&f'
  - '&7เป้าหมายเควส : ช่วยเหลือชายที่บาดเจ็บจากพิษของปีศาจตาฟ้า'
  - '&7- ตามหาหนังปีศาจต้องสาปเพื่อทำยาแก้พิษ'
  - '&f'
  - '&f &fรางวัลเควส'
