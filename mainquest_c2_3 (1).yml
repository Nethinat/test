          sound: ENTITY_PLAYER_LEVELUP
        gps:
          enabled: true
          mode: GPS
          custom_point: jing # ปรับ custom point ตามต้องการ
        goto: OBJECT obj12

      obj12:
        name_short: คุยกับจริ้ง
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fนี่ครับ ดอก Wither Rose ที่ท่านต้องการ'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fขอบคุณมาก... *ไอ*'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fเดี๋ยวไว้ยังไง เราค่อยมาคุยต่อนะ ฉันขอพักผ่อนก่อน...'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: QUEST_SUCCESS

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            AQUA
            BLUE
          fade_colors: |
            AQUA
            BLUE
          flicker: true
          trail: true
      count: 1
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |
        qc points %player_name% add 1 global
        mmocore admin exp give %player_name% main 200
      as_player: false