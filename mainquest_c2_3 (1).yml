          sound: ENTITY_PLAYER_LEVELUP
        gps:
          enabled: true
          mode: GPS
          custom_point: jing # ปรับ custom point ตามต้องการ
        goto: OBJECT obj10

      obj10:
        name_short: คุยกับจริ้ง
        type: SERVER_ACTIONS
        actions: 
          - 'SEND_MESSAGE &f &a%player_name%: &fนี่ครับ หนังของปีศาจต้องสาปที่ท่านต้องการ'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fขอบใจมาก ข้าชื่อจริ้ง'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fข้าจะเล่าให้ฟัง... เมื่อไม่นานมานี้ กองทัพปีศาจตาฟ้าได้บุกเข้ามาทำลายที่นี่'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fพวกมันทำลายทุกอย่าง... *ไอ* *ไอ*'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fอาการข้า... มันแย่ลง... *ไอหนัก*'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fท่านเป็นอะไรมากหรือเปล่า?'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aจริ้ง: &fข้าต้องการ... ดอก Wither Rose... มันจะช่วยบรรเทาอาการของข้าได้...'
          - 'SEND_MESSAGE &a'
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj11

      obj11:
        name_short: นำ &fดอก Wither Rose &f2อัน ไปให้ จริ้ง ที่พิกัด -503,77,-345
        objective_detail: นำ &fดอก Wither Rose &f2อัน ไปให้ จริ้ง ที่พิกัด -503,77,-345
        type: PLAYER_CITIZENS_NPC_INTERACT
        npc: 63  # ปรับ NPC ID ตามต้องการ
        items_needed:
          items:
            - item:
                type: wither_rose
#                custom_model_data: 10283 # ต้องตรงกับ obj9
              check: SameBase
              goal: 2
          take: true
          error_message: '&c[!] &7: นำ &fดอก Wither Rose &f2อัน ไปให้ จริ้ง ที่พิกัด -503,77,-345'
