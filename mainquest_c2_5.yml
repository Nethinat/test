      &f{description}
      {completions}
      {last_completion}
      {cooldown}
      {detailed_progression}
      {detailed_errors}
  COOLDOWN:
    type: PAPER
    custom_model_data: 10734
    name: '&c{quest}'
    lore: |
      &f{description}
      {completions}
      {last_completion}
      {cooldown}
