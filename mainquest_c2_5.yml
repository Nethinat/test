progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 10143
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
