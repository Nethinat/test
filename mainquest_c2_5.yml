# -------------------- Display settings --------------------
display_name: "&f &fเรียกตัวจากที่ไกล"
description: 
  - '&f'
  - '&f &aเควสหลักเมืองทูนาเรีย V'
  - '&fऎ ระดับความยาก : &f'
  - '&f'
  - '&7เป้าหมายเควส :  เหมือนว่าคุณจะโดนเรียกตัวจากใครบางคน'
  - '&f'
  - '&f &fรางวัลเควส'
  - "&f &f &ax1 &fแต้มเควส"
  - "&f &f &ax200 &fค่าประสบการณ์"
  - "&f &f &ax1 &fตราสัญลักษณ์รับรองนักเดินทาง"
  - "&f &f &ax16 &fขนมปัง"
  - '&f' 
  - '&fऑ คลิ๊กขวาเพื่อรับเควส'

start_notify:
  title: "&aดำเนินการเริ่มภารกิจ!!"
  sound: ENTITY_PLAYER_LEVELUP

progress_notify_scoreboard: true

all_status_item:
  type: PAPER
  custom_model_data: 11413
  name: '&6{quest}'
  lore: |
    &f{description}
    {completions}
    {last_completion}
    {cooldown}
    {detailed_progression}
    {detailed_errors}
    {controls}

status_items:
  UNAVAILABLE:
    type: BARRIER
    name: '&f &cภารกิจนี้ถูกล็อค &f'
    lore: |
      &c
      &eภารกิจเนื้อเรื่อง ฉบับที่ 2
      &c
      &cหากต้องการปลดล็อคภารกิจนี้ ผู้เล่นต้องสำเร็จภารกิจ
      &fฝันร้ายที่ไม่อาจลืมเลือน (บทเปิด)
      &cให้สำเร็จเสียก่อน ภารกิจนี้จึงจะปลดล็อค
  COOLDOWN:
    type: BARRIER
    name: '&f &cท่านได้ทำภารกิจนี้ไปแล้ว &f'
    lore: |
      &c
      &cท่านได้ทำภารกิจนี้สำเร็จแล้ว จึงไม่สามารถรับภารกิจนี้ซ้ำได้

# -------------------- Post-quest settings --------------------

completion:
  max_completions: 1
  notify:
    SUCCESS:
      title: '&aภารกิจสำเร็จแล้ว'
      sound: ENTITY_PLAYER_LEVELUP
    FAIL:
      title: '&cภารกิจ ล้มเหลว'
      title_subtitle: '&fคุณทำภารกิจ &c{quest} &fล้มเหลว!'
      sound: BLOCK_ANVIL_DESTROY
    CANCEL:
      title: '&cยกเลิก ภารกิจ'
      title_subtitle: '&fคุณได้ยกเลิกทำภารกิจ &c{quest}'
      sound: BLOCK_ANVIL_DESTROY
      
cooldown:
  duration: 10000 HOUR
  end_types: [SUCCESS]


branches:

  MAIN:
    starts_at: obj1
    objects:
      obj1:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &eคุณตื่นขึ้นมาที่ห้องเช่าของคุณ \nเตรียมตัวที่จะออกไปคุยกับ Gul ต่อ
          tppos %player_name% mainmmo -716 80 -324 0 290
        goto: OBJECT obj2

      obj2:
        name_short: เนื้อเรื่อง
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj3

      obj3:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fกลับไปคุยกับ Gul
        goto: OBJECT obj4

      obj4:
        name_short: กลับไปหา Gul ที่หมู่บ้านทะเลทรายเล็กม้วก
        objective_detail: กลับไปหา Gul ที่หมู่บ้านทะเลทรายเล็กม้วก
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-743,79,15
          radius: 3.0
        gps:
          enabled: true
          mode: GPS
          custom_point: gui
        goto: OBJECT obj5

      obj5:
        name_short: บทคุย
        type: SERVER_ACTIONS
        actions: 
          - 'SEND_MESSAGE &f &aGul: &f%player_name% ข้ามีข่าวจะบอกเจ้า'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fข้าจำได้ว่า...'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aGul: &fลูอิสเรียกให้เจ้ากลับไปที่เมือง 1 เหมือนจะมีเรืองอะไรสักอย่าง'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fขอบคุณสำหรับข่าว ข้าจะรีบไปเดี๋ยวนี้'
          - 'SEND_MESSAGE &a'
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj6

      obj6:
        name_short: กลับไปหา ลูอิส ที่หมู่บ้านเมล์เฟียร์
        objective_detail: กลับไปหา ลูอิส ที่หมู่บ้านเมล์เฟียร์
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-1286,69,-358
          radius: 5.0
        gps:
          enabled: true
          mode: GPS
          custom_point: luis
        goto: OBJECT obj7

      obj7:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fบรรยากาศแปลกๆ เริ่มเข้ามา
        goto: OBJECT obj8

      obj8:
        name_short: บทคุย
        type: SERVER_ACTIONS
        actions: 
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aลูอิส: &fเจ้าไม่เคยมาเยี่ยมข้าเลยนะ %player_name%'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aลูอิส: &fยินดีต้อนรับกลับมาที่จุดเริ่มต้นของเจ้า'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aลูอิส: &fข้าเรียกเจ้ามาเพื่อการตรวจประจำเดือน'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &a%player_name%: &fข้าขอโทษที่หายไปนาน แล้วการตรวจประจำเดือนมันมีอะไรบ้างหรอ?'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aลูอิส: &fก็แค่ตรวจเช็คพวกร่างกายน่ะ'
          - 'SEND_MESSAGE &a'
          - WAIT_TICKS 50
          - 'SEND_MESSAGE &f &aลูอิส: &fเอารายการนี้ไปแล้วทําส่ะนะ พอครบแล้วค่อยมาหาฉัน'
          - 'SEND_MESSAGE &a'
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj9

      obj9:
        name_short: วิ่งเป็นระยะทาง &b{objective_progression:a}&7/&b{objective_goal:a}
        objective_detail: วิ่งเป็นระยะทาง &b{objective_progression:a}&7/&b{objective_goal:a}
        type: PLAYER_MOVE
        goal: 2000.0
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        goto: OBJECT obj10

      obj10:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fคุณดูเหนื่อยมาก ดูเหมือนว่าคุณควรพักหน่อยนะ \n &eจากนั้นก็มองดู list สิ่งที่ต้องทําต่อ
        goto: OBJECT obj11

      obj11:
        name_short: กระโดดตบ &b{objective_progression:a}&7/&b{objective_goal:a} ครั้่ง
        objective_detail: กระโดดตบ &b{objective_progression:a}&7/&b{objective_goal:a} ครั้ง
        type: PLAYER_JUMP
        goal: 1000.0
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        goto: OBJECT obj12

      obj12:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fคุณดูเหนื่อยมากๆๆๆๆๆๆๆ ดูเหมือนว่าคุณควรจะต้องพักหน่อยนะ \n &eจากนั้นก็มองดู list สิ่งที่ต้องทําต่อ
        goto: OBJECT obj13

      obj13:
        name_short: ว่ายนํ้า &b{objective_progression:a}&7/&b{objective_goal:a} บล็อก
        objective_detail: ว่ายนํ้า &b{objective_progression:a}&7/&b{objective_goal:a} บล็อก
        type: PLAYER_JUMP
        goal: 1000.0
        complete_notify:
          sound: ENTITY_PLAYER_LEVELUP
        goto: OBJECT obj14

      obj14:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fคุณไม่ไหวแล้ว \n &eจึงได้กลับมานอนที่บ้านของชาน่า ผู้มีพระคุณ
        complete_journal_entry_messages: true
        complete_notify:
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
        hide_chat: true
        goto: OBJECT obj15

      obj15:
        name_short: กลับไปที่ห้องนอนของชาน่า
        objective_detail: กลับไปที่ห้องนอนของชาน่า
        type: PLAYER_POSITION
        display_distance: true
        position:
          type: SPHERE_INSIDE
          center: mainmmo,-1312,75,-337
          radius: 5.0
        gps:
          enabled: true
          mode: GPS
          custom_point: bedroom
        goto: OBJECT obj16

      obj16:
        name_short: เนื้อเรื่อง
        type: SERVER_COMMANDS_PERFORM
        commands: |  # the commands to perform
          cmi titlemsg %player_name% &fโปรดติดตามตอนต่อไป
        goto: QUEST_SUCCESS

end_objects:
  SUCCESS:
    - type: SERVER_FIREWORKS_LAUNCH
      effects:
        - type: CREEPER
          colors: |
            AQUA
            BLUE
          fade_colors: |
            AQUA
            BLUE
          flicker: true
          trail: true
      count: 1
      position:
        type: PLAYER_RELATIVE_SINGLE
        location:
          distance: 3
          vertical_offset: 1
    - type: SERVER_COMMANDS_PERFORM
      commands: |
        qc points %player_name% add 1 global
        mmocore admin exp give %player_name% main 200
      as_player: false