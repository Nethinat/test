          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &d&lมิอาว์ &f: "เมี้ยว~ ต้องใจเย็นๆ ก่อน เจ้ายังต้องฝึกฝนอีกมาก เพื่อจะได้พบกับความลับในถ้ำนั้น"'
          - 'SEND_MESSAGE &f'
          - SEND_SOUND entity_cat_ambient
          - WAIT_TICKS 60
          - 'SEND_MESSAGE &d&lมิอาว์ &f: "พักผ่อนให้ดีนะเมี้ยววว~ เพราะพรุ่งนี้ เราจะมีผจญภัยอีกมากมาย"'
          - 'SEND_MESSAGE &f'
